<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Panda">
  <rect width="64" height="64" rx="14" fill="#ffffff"/>
  <!-- ears -->
  <circle cx="20" cy="19" r="7.5" fill="#111418"/>
  <circle cx="44" cy="19" r="7.5" fill="#111418"/>
  <!-- face outline -->
  <circle cx="32" cy="35" r="19" fill="#ffffff" stroke="#111418" stroke-width="2.5"/>
  <!-- eye patches -->
  <ellipse cx="24" cy="33" rx="5.5" ry="7" fill="#111418" transform="rotate(-12 24 33)"/>
  <ellipse cx="40" cy="33" rx="5.5" ry="7" fill="#111418" transform="rotate(12 40 33)"/>
  <!-- eyes -->
  <circle cx="24.5" cy="34" r="2" fill="#ffffff"/>
  <circle cx="39.5" cy="34" r="2" fill="#ffffff"/>
  <!-- nose -->
  <ellipse cx="32" cy="42" rx="3" ry="2.2" fill="#111418"/>
</svg>
