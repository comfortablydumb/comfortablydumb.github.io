<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex" />
    <meta name="referrer" content="no-referrer" />
    <meta name="theme-color" content="#ffffff" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Escalation</title>

    <style>
      /* Tokens lifted verbatim from src/styles/global.css so this page reads
         as part of the site in both themes. */
      :root {
        --font-sans: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          Roboto, Helvetica, Arial, sans-serif, "Apple Color Emoji",
          "Segoe UI Emoji";
        --font-mono: ui-monospace, SFMono-Regular, Menlo, Consolas,
          "Liberation Mono", monospace;

        --bg: #ffffff;
        --bg-subtle: #f7f7f7;
        --text: #2a2a2a;
        --text-muted: #6b7280;
        --text-faint: #9098a3;
        --link: #2563eb;
        --border: #e3e3e3;
        --selection: #d7e3ff;
        --btn-primary-bg: #2563eb;
      }

      [data-theme="dark"] {
        --bg: #1b1c1e;
        --bg-subtle: #232427;
        --text: #cdcfd2;
        --text-muted: #969aa1;
        --text-faint: #6b7280;
        --link: #7aa2f7;
        --border: #34363a;
        --selection: #2b3a5e;
        --btn-primary-bg: #3b5bdb;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
      }
      [hidden] {
        display: none !important;
      }

      html {
        font-family: var(--font-sans);
        font-size: 18px;
        line-height: 1.6;
        background: var(--bg);
        color: var(--text);
        -webkit-text-size-adjust: 100%;
      }

      body {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        max-width: 34rem;
        margin: 0 auto;
        padding: 3rem 1.25rem;
      }

      ::selection {
        background: var(--selection);
      }

      h1 {
        font-size: 1.7rem;
        font-weight: 700;
        line-height: 1.25;
        margin-bottom: 0.75rem;
      }

      p {
        margin: 0.8rem 0;
      }

      .eyebrow {
        font-family: var(--font-mono);
        font-size: 0.75rem;
        letter-spacing: 0.3em;
        text-transform: uppercase;
        color: var(--text-faint);
        margin: 0 0 0.6rem;
      }

      .muted {
        color: var(--text-muted);
        font-size: 0.95rem;
      }

      .muted-slot {
        color: var(--text-faint);
        font-size: 0.9rem;
        font-family: var(--font-mono);
        border-left: 2px solid var(--border);
        padding-left: 0.75rem;
      }

      .emphasis {
        font-weight: 700;
      }

      .signoff {
        margin-top: 2rem;
        color: var(--text-faint);
        font-size: 0.95rem;
      }

      /* ---- buttons: same shape language as global.css .btn ---- */
      .btn {
        display: inline-block;
        font-family: inherit;
        font-size: 0.92rem;
        padding: 0.45rem 0.85rem;
        border: 1px solid var(--border);
        border-radius: 5px;
        background: var(--bg);
        color: var(--link);
        text-decoration: none;
        cursor: pointer;
        text-align: center;
      }
      .btn:hover {
        border-color: var(--link);
      }
      .btn-primary {
        background: var(--btn-primary-bg);
        border-color: var(--btn-primary-bg);
        color: #fff;
      }
      .btn-primary:hover {
        opacity: 0.9;
        color: #fff;
      }
      .btn-quiet {
        border-color: transparent;
        color: var(--text-muted);
      }
      .btn-quiet:hover {
        border-color: var(--border);
        color: var(--text);
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 0.6rem;
        align-items: center;
        margin-top: 1.75rem;
      }

      .slots {
        display: grid;
        gap: 0.5rem;
        margin-top: 1.5rem;
      }

      /* ---- the gate ---- */
      .gate-form {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
        margin-top: 1.5rem;
      }
      .gate-input {
        flex: 1 1 14rem;
        font-family: inherit;
        font-size: 0.95rem;
        padding: 0.45rem 0.7rem;
        color: var(--text);
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 5px;
      }
      .gate-input:focus {
        outline: 2px solid var(--link);
        outline-offset: 1px;
        border-color: var(--link);
      }
      .gate-input::placeholder {
        color: var(--text-faint);
      }
      .hint {
        margin-top: 1rem;
        font-size: 0.85rem;
        color: var(--text-faint);
      }
      .status {
        margin-top: 0.9rem;
        font-size: 0.9rem;
        color: var(--text-muted);
        min-height: 1.4em;
      }

      .shake {
        animation: shake 0.35s ease;
      }
      @keyframes shake {
        0%, 100% { transform: translateX(0); }
        25% { transform: translateX(-5px); }
        75% { transform: translateX(5px); }
      }
      @media (prefers-reduced-motion: reduce) {
        .shake { animation: none; }
      }

      /* Panels fade in so the reveal is not abrupt. */
      [data-panel] {
        animation: fade 0.45s ease both;
      }
      @keyframes fade {
        from { opacity: 0; transform: translateY(6px); }
        to { opacity: 1; transform: none; }
      }
      @media (prefers-reduced-motion: reduce) {
        [data-panel] { animation: none; }
      }
    </style>
  </head>

  <body>
    <main>
      <section id="gate">
        <p class="eyebrow">Private</p>
        <h1>One question first.</h1>
        <p class="muted">
          This page is meant for exactly one person. If that's you, you already
          know the answer.
        </p>

        <form class="gate-form" id="gate-form" autocomplete="off">
          <input
            class="gate-input"
            id="pw"
            type="password"
            placeholder="the answer"
            autocomplete="off"
            autocapitalize="off"
            autocorrect="off"
            spellcheck="false"
            aria-label="Password"
          />
          <button class="btn btn-primary" type="submit" id="go">Unlock</button>
        </form>

        <p class="status" id="status" role="status" aria-live="polite"></p>
        <p class="hint">You know this one.</p>
      </section>

      <div id="vault" hidden></div>
    </main>

    <script>
      (function () {
        // Match the site's theme choice if the visitor has one stored.
        try {
          var stored = localStorage.getItem("theme");
          var dark = stored
            ? stored === "dark"
            : window.matchMedia("(prefers-color-scheme: dark)").matches;
          if (dark) {
            document.documentElement.setAttribute("data-theme", "dark");
            var m = document.querySelector('meta[name="theme-color"]');
            if (m) m.setAttribute("content", "#1b1c1e");
          }
        } catch (e) {}

        var payload = JSON.parse(
          document.getElementById("payload").textContent
        );
        var gate = document.getElementById("gate");
        var vault = document.getElementById("vault");
        var form = document.getElementById("gate-form");
        var input = document.getElementById("pw");
        var status = document.getElementById("status");
        var go = document.getElementById("go");

        function b64(s) {
          var bin = atob(s);
          var out = new Uint8Array(bin.length);
          for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
          return out;
        }

        // Forgiving on case and stray spaces, so a typed phrase still works.
        // Must stay identical to normalize() in lock.mjs.
        function normalize(s) {
          return s.normalize("NFKC").trim().toLowerCase().replace(/\s+/g, " ");
        }

        async function unlock(password) {
          var enc = new TextEncoder();
          var km = await crypto.subtle.importKey(
            "raw",
            enc.encode(normalize(password)),
            "PBKDF2",
            false,
            ["deriveKey"]
          );
          var key = await crypto.subtle.deriveKey(
            {
              name: "PBKDF2",
              salt: b64(payload.s),
              iterations: payload.it,
              hash: "SHA-256",
            },
            km,
            { name: "AES-GCM", length: 256 },
            false,
            ["decrypt"]
          );
          var plain = await crypto.subtle.decrypt(
            { name: "AES-GCM", iv: b64(payload.i) },
            key,
            b64(payload.d)
          );
          return new TextDecoder().decode(plain);
        }

        function show(id) {
          var panels = vault.querySelectorAll("[data-panel]");
          for (var i = 0; i < panels.length; i++) {
            var p = panels[i];
            p.hidden = p.getAttribute("data-panel") !== id;
            if (!p.hidden) {
              // restart the fade for the newly shown panel
              p.style.animation = "none";
              void p.offsetWidth;
              p.style.animation = "";
            }
          }
          window.scrollTo({ top: 0, behavior: "smooth" });
        }

        function wire() {
          var steps = vault.querySelectorAll("[data-goto]");
          for (var i = 0; i < steps.length; i++) {
            steps[i].addEventListener("click", function () {
              var slot = this.getAttribute("data-slot");
              if (slot) {
                var outs = vault.querySelectorAll("[data-slot-out]");
                for (var j = 0; j < outs.length; j++) {
                  outs[j].textContent = slot;
                }
                var links = vault.querySelectorAll("[data-slot-href]");
                for (var k = 0; k < links.length; k++) {
                  links[k].href = links[k]
                    .getAttribute("data-slot-href")
                    .replace("%s", encodeURIComponent(slot));
                }
              }
              show(this.getAttribute("data-goto"));
            });
          }
        }

        form.addEventListener("submit", async function (e) {
          e.preventDefault();
          var pw = input.value;
          if (!pw) return;

          if (!window.crypto || !window.crypto.subtle) {
            status.textContent =
              "This needs a secure connection. Try the https:// link.";
            return;
          }

          go.disabled = true;
          status.textContent = "Checking...";

          try {
            var html = await unlock(pw);
            vault.innerHTML = html;
            wire();
            gate.hidden = true;
            vault.hidden = false;
            document.title = "Hi";
          } catch (err) {
            go.disabled = false;
            status.textContent = "That's not it. Try again.";
            input.select();
            gate.classList.remove("shake");
            void gate.offsetWidth;
            gate.classList.add("shake");
          }
        });

        input.focus();
      })();
    </script>
  </body>
</html>
